<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Music Player</title>
    <style>
        /* CSS: Minimalist Dark Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Your background image */
            background-image: url('MusicPlayerImg/background.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(5px) brightness(0.6);
            transform: scale(1.1);
            z-index: -1;
        }

        .player-card {
            position: fixed;
            background-color: #262626;
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 350px;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #333333;
            border-radius: 12px;
            margin-bottom: 0.9rem;
            background-image: url('MusicPlayerImg/coverart.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .track-info {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info h2 {
            font-size: 1.4rem;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info p {
            color: #999999;
            font-size: 0.9rem;
            margin-bottom: 0.9rem;
        }

        .progress-container {
            margin-bottom: 0.9rem;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #888888;
            margin-top: 0.5rem;
            font-variant-numeric: tabular-nums;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            margin-top: -4px;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #555555;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px; 
            position: relative; /* Added this */
            width: 100%;        /* Added this */
        }
        .btn {
            background: none;
            border: none;
            color: #dddddd;
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.2s, transform 0.2s;
        }

        .btn:hover {
            color: #4CAF50;
        }

        
        .btn.active {
            color: #ffffff;
            text-shadow: 0 0 15px rgb(47, 166, 0);
        }

        .btn-play {
            background-color: #4CAF50;
            color: #1a1a1a;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .btn-play:hover {
            background-color: #45a049;
            color: #1a1a1a;
            transform: scale(1.05);
        }

        #play-icon {
            font-size: 1.6rem;
            margin-left: 4px;
        }


        
        .repeat-icon {
            font-size: 1.3rem;
            position: absolute; 
            right: 0;           
        }
    </style>
</head>

<body>

    <div class="player-card">
        <div class="cover-art"></div>

        <div class="track-info">
            <h2 id="track-title">Loading...</h2>
            <p id="track-artist">Loading...</p>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prevTrack()">&#9194;</button>
            <button class="btn btn-play" onclick="togglePlay()">
                <span id="play-icon">&#9654;</span>
            </button>
            <button class="btn" onclick="nextTrack()">&#9193;</button>
            
            <button class="btn repeat-icon" id="repeat-btn" onclick="toggleRepeat()">&#128257;</button>
        </div>

        <audio id="audio-player"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const repeatBtn = document.getElementById('repeat-btn');

        // Added 'artist' fields to your custom playlist
        const playlist = [
            {
                title: "7 Years",
                artist: "Lukas Graham",
                src: "Audio.mp3/7 Years [Official Music Video]_LHCob76kigA.mp3"
            },
            {
                title: "Another Love",
                artist: "Tom Odell",
                src: "Audio.mp3/Another Love (Lyrics)_QFE0WqS2mhI.mp3"
            },
            {
                title: "Eastside",
                artist: "benny blanco, Halsey & Khalid",
                src: "Audio.mp3/Eastside (official video).mp3"
            },
            {
                title: "Shape Of You",
                artist: "Ed Sheeran",
                src: "Audio.mp3/Ed_Sheeran_-_Shape_of_You_[Official_Video].mp3"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isRepeat = false;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;

            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";

            if (isPlaying) {
                audio.play();
            }
        }

        function nextTrack() {
            currentTrackIndex++;
            if (currentTrackIndex > playlist.length - 1) {
                currentTrackIndex = 0;
            }
            loadTrack(currentTrackIndex);
        }

        function prevTrack() {
            currentTrackIndex--;
            if (currentTrackIndex < 0) {
                currentTrackIndex = playlist.length - 1;
            }
            loadTrack(currentTrackIndex);
        }

        // --- Toggle Repeat State ---
        function toggleRepeat() {
            isRepeat = !isRepeat;
            if (isRepeat) {
                repeatBtn.classList.add('active');
            } else {
                repeatBtn.classList.remove('active');
            }
        }

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                playIcon.innerHTML = '&#10074;&#10074;';
                playIcon.style.marginLeft = '0';
                playIcon.style.fontSize = '1.2rem';
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.innerHTML = '&#9654;';
                playIcon.style.marginLeft = '4px';
                playIcon.style.fontSize = '1.6rem';
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        progressBar.addEventListener('input', (e) => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        });

        // --- Handle song ending based on Repeat status ---
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        loadTrack(currentTrackIndex);
    </script>
</body>

</html>
