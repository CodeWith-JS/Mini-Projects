<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Protocol | Agent Roster</title>
    <style>
        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Linear gradient acts as a dark overlay to maintain text contrast against the wallpaper */
            background: linear-gradient(rgba(26, 26, 26, 0.88), rgba(26, 26, 26, 0.88)), url('https://images6.alphacoders.com/125/thumbbig-1253479.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Parallax/locked background */
            color: #eeeeee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 2rem;
        }

        /* Layout Structure */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
            max-width: 1000px;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #333333;
            padding-bottom: 1rem;
        }

        /* Filter Controls */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-btn {
            background-color: #262626;
            color: #aaaaaa;
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            color: #ffffff;
            background-color: #333333;
        }

        /* Active filter state using standard Val Red */
        .filter-btn.active {
            background-color: #ff4655;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 70, 85, 0.3);
        }

        /* Responsive grid: auto-fills available space, min column width 280px */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }

        /* Base Card Styling */
        .agent-card {
            background-color: #262626;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border-top: 4px solid #333333;
        }

        /* Card hover state */
        .agent-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border-top-color: #ff4655;
        }

        /* Image wrapper handles overflow and centers the portrait */
        .card-image-placeholder {
            height: 250px;
            background-color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 2rem;
            font-weight: bold;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* object-fit cover ensures the portrait fills the container properly */
        .card-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.3s ease;
        }

        .agent-card:hover .card-image-placeholder img {
            transform: scale(1.08);
        }

        /* Card Typography */
        .agent-role {
            display: block;
            text-align: center;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff4655;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .agent-name {
            display: block;
            text-align: center;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            margin-top: 0.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .agent-desc {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #aaaaaa;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Valorant Protocol</h1>
        <div class="filters" id="filters">
            <button class="filter-btn active" data-role="All">All Agents</button>
            <button class="filter-btn" data-role="Duelist">Duelists</button>
            <button class="filter-btn" data-role="Initiator">Initiators</button>
            <button class="filter-btn" data-role="Controller">Controllers</button>
            <button class="filter-btn" data-role="Sentinel">Sentinels</button>
        </div>
    </div>

    <!-- DOM target for generated agent cards -->
    <div class="agent-grid" id="agent-grid"></div>

    <script>
    // Master data array
    let agents = []; 
    
    const agentGrid = document.getElementById('agent-grid');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Utility: Kept around in case I want to revert to random dynamic player card backgrounds
    async function fetchBackground() {
        const url = 'https://valorant-api.com/v1/playercards';

        try {
            const response = await fetch(url);
            const apiData = await response.json();

            // Pull a random card from the payload
            const randomIndex = Math.floor(Math.random() * apiData.data.length);
            const randomCard = apiData.data[randomIndex];

            // Extract the landscape version (wideArt)
            const backgroundUrl = randomCard.wideArt;

            // Inject inline styles for the gradient overlay
            document.body.style.backgroundImage = `linear-gradient(rgba(26, 26, 26, 0.85), rgba(26, 26, 26, 0.85)), url('${backgroundUrl}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed'; 

        } catch (error) {
            console.error("Error fetching background:", error);
        }
    }

    // Fetches the roster payload from the unofficial Valorant API
    async function fetchValorantAgents() {
        // Query param required to filter out unplayable test assets (e.g., 'Sova Hunter')
        const url = 'https://valorant-api.com/v1/agents?isPlayableCharacter=true';

        try {
            const response = await fetch(url);
            const apiData = await response.json();

            // Map the raw API response down to a simpler object structure for the UI
            agents = apiData.data.map(agent => {
                return {
                    name: agent.displayName,
                    role: agent.role ? agent.role.displayName : "Unknown",
                    desc: agent.description,
                    img: agent.displayIcon 
                };
            });

            // Initial render
            displayAgents(agents);

        } catch (error) {
            console.error("Error fetching Valorant data:", error);
            agentGrid.innerHTML = `<h2 style="color: #ff4655;">Failed to load agent database.</h2>`;
        }
    }

    // Rebuilds the DOM grid based on the passed array
    function displayAgents(agentsToDisplay) {
        agentGrid.innerHTML = ""; 

        agentsToDisplay.forEach(agent => {
            const card = document.createElement('div');
            card.classList.add('agent-card');

            card.innerHTML = `
                <div class="card-image-placeholder">
                    <img src="${agent.img}" alt="${agent.name}">
                </div>
                <div class="card-content">
                    <span class="agent-name">${agent.name}</span>
                    <h2 class="agent-role">${agent.role}</h2>
                    <p class="agent-desc">${agent.desc}</p>
                </div>
            `;

            agentGrid.appendChild(card);
        });
    }

    // Event listeners for role filters
    filterButtons.forEach(button => {
        button.addEventListener('click', function() {
            // Reset active states
            filterButtons.forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');

            const selectedRole = this.getAttribute('data-role');

            if (selectedRole === "All") {
                displayAgents(agents);
            } else {
                // Return a new array matching the selected category and trigger a re-render
                const filteredAgents = agents.filter(agent => agent.role === selectedRole);
                displayAgents(filteredAgents);
            }
        });
    });

    // Init app
    fetchValorantAgents();
    
</script>
</body>

</html>
